<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <style>
        :root {
            --bg-lavender: #B4A5CF;
            --light-purple: #D7B4D4;
            --yes-yellow: #EEDFB2;
            --no-rose: #D47B91;
            --text-mauve: #82637a;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-lavender);
            /* Heart GIF background with 15% opacity */
            background: linear-gradient(rgba(180, 165, 207, 0.85), rgba(180, 165, 207, 0.85)), 
                        url('./IMG_1279.gif?v=3');
            background-size: cover, 100px;
            background-repeat: no-repeat, repeat;
            background-attachment: fixed;
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            width: 85%;
            max-width: 350px;
            background-color: #fcfafc; /* Soft off-white card */
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid var(--light-purple);
        }

        h1 {
            font-size: 1.6rem;
            color: var(--text-mauve);
            margin-bottom: 25px;
            font-weight: normal;
        }

        .img-wrapper {
            padding: 8px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        #me-img {
            width: 180px;
            display: block;
            border-radius: 8px;
        }

        .buttons-column {
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 15px; 
            width: 100%;
        }

        button {
            font-weight: bold;
            border: none;
            border-radius: 8px; /* Slightly rounded boxy style */
            cursor: pointer;
            transition: all 0.4s ease;
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: white;
        }

        #yesButton {
            background-color: var(--yes-yellow);
            color: var(--text-mauve); /* Darker text for yellow contrast */
            padding: 12px 40px;
            font-size: 1rem;
        }

        #noButton {
            background-color: var(--no-rose);
            padding: 12px 40px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="container" id="main-content">
        <h1>Will you be my Valentine?</h1>
        
        <div class="img-wrapper">
            <img src="./IMG_3913.jpeg" alt="Valentine" id="me-img">
        </div>

        <div class="buttons-column">
            <button id="yesButton" onclick="celebrate()">YES</button>
            <button id="noButton" onclick="handleNoClick()">NO</button>
        </div>
    </div>

    <script>
        let clickCount = 0;
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');

        const noTexts = [
            "Are you sure?",
            "Really sure?",
            "I will be really sad",
            "Please",
            "Please naaaaa",
            "Chal chal yes daba",
            "YES BOLA MAINE",
            "Senior ko no nhi bolte"
        ];

        function handleNoClick() {
            if (navigator.vibrate) {
                navigator.vibrate(50); 
            }

            if (clickCount < noTexts.length) {
                noButton.innerText = noTexts[clickCount];
            }

            clickCount++;

            /* SUBTLE GROWTH */
            let paddingV = 12 + (clickCount * 4); 
            let paddingH = 40 + (clickCount * 6);
            let fontSize = 1 + (clickCount * 0.04);

            yesButton.style.padding = `${paddingV}px ${paddingH}px`;
            yesButton.style.fontSize = `${fontSize}rem`;

            if (clickCount > noTexts.length) {
                noButton.style.display = 'none';
            }
        }

        function celebrate() {
            document.getElementById('main-content').innerHTML = `
                <h1 style="font-size: 2.5rem; color: var(--text-mauve);">Yay! ❤️</h1>
                <p style="color: var(--text-mauve); font-size: 1.2rem;">See you on the 14th!</p>
            `;
        }
    </script>
</body>
</html>
