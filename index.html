<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <style>
        :root {
            --primary-color: #FF4D6D; /* Your color code here */
            --bg-pink: #FFF0F3;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-pink);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 400px; /* Constrained width to prevent screen covering */
        }

        h1 {
            font-size: 2rem; /* Scaled down */
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        /* Subtle Photo Frame */
        .img-wrapper {
            display: inline-block;
            padding: 8px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            border: 1px solid rgba(0,0,0,0.05);
        }

        #me-img {
            width: 220px; /* Medium size */
            display: block;
            border-radius: 6px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px; /* Space between buttons */
            position: relative;
            height: 60px;
        }

        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        #yesButton {
            background-color: #4CAF50;
            color: white;
            z-index: 1;
        }

        #noButton {
            background-color: var(--primary-color);
            color: white;
            z-index: 2;
            /* Starts relative so it sits next to YES, 
               JS will change this to absolute on first move */
            position: relative; 
        }

        .heart-icon {
            display: inline-block;
            font-size: 1.5rem;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <div class="container" id="main-content">
        <h1>Will you be my Valentine? <span class="heart-icon">💖</span></h1>
        
        <div class="img-wrapper">
            <img src="./IMG_3913.jpeg" alt="Valentine" id="me-img">
        </div>

        <div class="buttons">
            <button id="yesButton" onclick="celebrate()">YES 💚</button>
            <button id="noButton">No ❤️</button>
        </div>
    </div>

    <script>
        const noButton = document.getElementById('noButton');
        let moveCount = 0;

        function moveAndVibrate(e) {
            // Vibrate phone
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }

            moveCount++;

            // After 5 attempts, it disappears
            if (moveCount >= 5) {
                noButton.style.opacity = '0';
                setTimeout(() => {
                    noButton.style.display = 'none';
                }, 300);
                return;
            }

            // Switch to absolute only when it needs to start jumping
            noButton.style.position = 'absolute';

            // Calculate random position within screen bounds
            const padding = 20;
            const x = Math.random() * (window.innerWidth - noButton.offsetWidth - padding);
            const y = Math.random() * (window.innerHeight - noButton.offsetHeight - padding);
            
            noButton.style.left = `${x}px`;
            noButton.style.top = `${y}px`;
        }

        noButton.addEventListener('mouseover', moveAndVibrate);
        noButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveAndVibrate();
        });

        function celebrate() {
            document.getElementById('main-content').innerHTML = `
                <h1 style="font-size: 3rem;">YAY! ❤️</h1>
                <p style="font-size: 1.2rem;">Best decision ever!</p>
            `;
        }
    </script>
</body>
</html>
