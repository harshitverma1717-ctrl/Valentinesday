<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <style>
        :root {
            --primary-red: #f44336;
            --accent-green: #4caf50;
            --bg-pink: #fff0f3;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-pink);
            /* BACKGROUND HEARTS with lower opacity effect */
            background: linear-gradient(rgba(255, 240, 243, 0.7), rgba(255, 240, 243, 0.7)), 
                        url('./IMG_1279.gif?v=3');
            background-size: cover, 120px;
            background-repeat: no-repeat, repeat;
            background-attachment: fixed;
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
            padding: 25px;
            width: 85%;
            max-width: 400px;
            background-color: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(3px);
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.8rem;
            color: #d63384;
            margin-bottom: 20px;
        }

        .img-wrapper {
            padding: 8px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        #me-img {
            width: 190px;
            display: block;
            border-radius: 6px;
        }

        .buttons-column {
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 15px; 
            width: 100%;
        }

        button {
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
        }

        #yesButton {
            background-color: var(--accent-green);
            color: white;
            padding: 15px 40px;
            font-size: 1.1rem;
        }

        #noButton {
            background-color: var(--primary-red);
            color: white;
            padding: 10px 25px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container" id="main-content">
        <h1>Will you be my Valentine? 💖</h1>
        
        <div class="img-wrapper">
            <img src="./IMG_3913.jpeg" alt="Valentine" id="me-img">
        </div>

        <div class="buttons-column">
            <button id="yesButton" onclick="celebrate()">YES 💚</button>
            <button id="noButton" onclick="handleNoClick()">No ❤️</button>
        </div>
    </div>

    <script>
        let clickCount = 0;
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');

        const noTexts = [
            "Are you sure?",
            "Really sure?",
            "I will be really sad",
            "Please",
            "Please naaaaa",
            "Chal chal yes daba",
            "YES BOLA MAINE",
            "Senior ko no nhi bolte"
        ];

        function handleNoClick() {
            if (navigator.vibrate) {
                navigator.vibrate(70); 
            }

            if (clickCount < noTexts.length) {
                noButton.innerText = noTexts[clickCount];
            }

            clickCount++;

            /* SMALLER GROWTH LOGIC */
            // Reduced increments (6px padding and 0.1rem font per click)
            let newPaddingV = 15 + (clickCount * 6); 
            let newPaddingH = 40 + (clickCount * 10);
            let newFontSize = 1.1 + (clickCount * 0.1);

            yesButton.style.padding = `${newPaddingV}px ${newPaddingH}px`;
            yesButton.style.fontSize = `${newFontSize}rem`;

            if (clickCount > noTexts.length) {
                noButton.style.display = 'none';
            }
        }

        function celebrate() {
            document.getElementById('main-content').innerHTML = `
                <h1 style="font-size: 2.5rem;">YAY! ❤️</h1>
                <p style="font-size: 1.2rem;">Best decision ever!</p>
            `;
        }
    </script>
</body>
</html>
