<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --vibrant-coral: #E67A7A; 
            --mint-green: #90CF8E;    
            --off-white: #FDF2F2;
            --pixel-black: #2D2D2D;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--off-white);
            background: linear-gradient(rgba(253, 242, 242, 0.85), rgba(253, 242, 242, 0.85)), 
                        url('./IMG_1279.gif?v=3');
            background-size: cover, 80px;
            font-family: 'Press Start 2P', cursive;
        }

        /* Pixelated Border Style */
        .pixel-border {
            background-color: var(--off-white);
            border: 4px solid var(--pixel-black);
            position: relative;
            box-shadow: 
                /* Inner Highlight */
                inset -4px -4px 0px 0px #ddd,
                /* Blocky Shadow */
                8px 8px 0px 0px var(--pixel-black);
        }

        .container {
            text-align: center;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 12px;
            color: var(--pixel-black);
            line-height: 1.8;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .img-wrapper {
            padding: 8px;
            background: white;
            border: 4px solid var(--pixel-black);
            margin-bottom: 30px;
            box-shadow: 4px 4px 0px var(--pixel-black);
        }

        #me-img {
            width: 180px;
            display: block;
            image-rendering: pixelated;
        }

        .buttons-column {
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 20px; 
            width: 100%;
        }

        button {
            font-family: 'Press Start 2P', cursive;
            border: 4px solid var(--pixel-black);
            cursor: pointer;
            transition: all 0.1s ease-in-out;
            text-transform: uppercase;
            width: 220px; /* SAME INITIAL WIDTH */
            height: 60px;  /* SAME INITIAL HEIGHT */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #yesButton {
            background-color: var(--mint-green);
            color: var(--pixel-black);
            font-size: 14px;
            box-shadow: 4px 4px 0px var(--pixel-black);
            z-index: 10;
        }

        #noButton {
            background-color: var(--vibrant-coral);
            color: white;
            font-size: 14px; /* Same initial font size */
            box-shadow: 4px 4px 0px var(--pixel-black);
        }

        button:active {
            box-shadow: 0px 0px 0px;
            transform: translate(4px, 4px);
        }
    </style>
</head>
<body>

    <div class="container pixel-border" id="main-content">
        <h1>Will you be my Valentine?</h1>
        
        <div class="img-wrapper">
            <img src="./IMG_3913.jpeg" alt="Valentine" id="me-img">
        </div>

        <div class="buttons-column">
            <button id="yesButton" onclick="celebrate()">YES</button>
            <button id="noButton" onclick="handleNoClick()">NO</button>
        </div>
    </div>

    <script>
        let clickCount = 0;
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');

        const noTexts = [
            "Are you sure?",
            "Really sure?",
            "I will be sad",
            "Please",
            "Please naaaaa",
            "Chal daba na yes",
            "YES BOLA MAINE",
            "Boss ko no nhi bolte"
        ];

        function handleNoClick() {
            if (navigator.vibrate) {
                navigator.vibrate(80); 
            }

            if (clickCount < noTexts.length) {
                noButton.innerText = noTexts[clickCount];
            }

            clickCount++;

            /* GROWTH LOGIC */
            // Using min-width/height to expand the YES button
            let newWidth = 220 + (clickCount * 25);
            let newHeight = 60 + (clickCount * 15);
            let fontSize = 14 + (clickCount * 3);

            yesButton.style.width = `${newWidth}px`;
            yesButton.style.height = `${newHeight}px`;
            yesButton.style.fontSize = `${fontSize}px`;

            if (clickCount > noTexts.length) {
                noButton.style.display = 'none';
            }
        }

        function celebrate() {
            document.getElementById('main-content').innerHTML = `
                <h1 style="font-size: 18px;">YAY! ❤️</h1>
                <p style="font-size: 10px; color: var(--pixel-black); line-height: 2;">SEE YOU ON <br> THE 14TH!</p>
            `;
        }
    </script>
</body>
</html>
