<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-lavender: #B4A5CF;
            --light-purple: #D7B4D4;
            --yes-yellow: #EEDFB2;
            --no-rose: #D47B91;
            --text-mauve: #82637a;
            --off-white: #fcfafc;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-lavender);
            /* Soft heart background */
            background: linear-gradient(rgba(180, 165, 207, 0.8), rgba(180, 165, 207, 0.8)), 
                        url('./IMG_1279.gif?v=3');
            background-size: cover, 100px;
            background-repeat: no-repeat, repeat;
            background-attachment: fixed;
            /* Applying Pixel Font */
            font-family: 'Press Start 2P', cursive;
            color: var(--text-mauve);
        }

        .container {
            text-align: center;
            padding: 40px 25px;
            width: 85%;
            max-width: 400px;
            background-color: var(--off-white);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            border: 4px solid var(--light-purple);
        }

        h1 {
            font-size: 14px; /* Pixel fonts look best at smaller sizes */
            line-height: 1.6;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .img-wrapper {
            padding: 10px;
            background: white;
            border-radius: 8px;
            border: 3px solid var(--light-purple);
            margin-bottom: 30px;
        }

        #me-img {
            width: 200px;
            display: block;
            image-rendering: pixelated; /* Keeps it sharp like pixel art */
        }

        .buttons-column {
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 20px; 
            width: 100%;
        }

        button {
            font-family: 'Press Start 2P', cursive;
            border: 4px solid var(--text-mauve);
            border-radius: 0; /* Boxy pixel style */
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            text-transform: uppercase;
            font-size: 10px;
            padding: 15px 30px;
            box-shadow: 4px 4px 0px var(--text-mauve);
        }

        button:active {
            box-shadow: 0px 0px 0px;
            transform: translate(2px, 2px);
        }

        #yesButton {
            background-color: var(--yes-yellow);
            color: var(--text-mauve);
        }

        #noButton {
            background-color: var(--no-rose);
            color: white;
        }
    </style>
</head>
<body>

    <div class="container" id="main-content">
        <h1>Will you be my Valentine?</h1>
        
        <div class="img-wrapper">
            <img src="./IMG_3913.jpeg" alt="Valentine" id="me-img">
        </div>

        <div class="buttons-column">
            <button id="yesButton" onclick="celebrate()">YES</button>
            <button id="noButton" onclick="handleNoClick()">NO</button>
        </div>
    </div>

    <script>
        let clickCount = 0;
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');

        const noTexts = [
            "Are you sure?",
            "Really sure?",
            "I will be sad",
            "Please",
            "Please naaaaa",
            "Daba na yes",
            "YES BOLA MAINE",
            "No nhi bolte"
        ];

        function handleNoClick() {
            if (navigator.vibrate) {
                navigator.vibrate(50); 
            }

            if (clickCount < noTexts.length) {
                noButton.innerText = noTexts[clickCount];
            }

            clickCount++;

            /* SUBTLE PIXEL GROWTH */
            // Smaller increments to maintain the lofi aesthetic
            let paddingV = 15 + (clickCount * 3); 
            let paddingH = 30 + (clickCount * 5);
            let fontSize = 10 + (clickCount * 0.5);

            yesButton.style.padding = `${paddingV}px ${paddingH}px`;
            yesButton.style.fontSize = `${fontSize}px`;

            if (clickCount > noTexts.length) {
                noButton.style.display = 'none';
            }
        }

        function celebrate() {
            document.getElementById('main-content').innerHTML = `
                <h1 style="font-size: 18px;">YAY! <br> ❤️</h1>
                <p style="font-size: 10px; line-height: 2;">See you on <br> the 14th!</p>
            `;
        }
    </script>
</body>
</html>
