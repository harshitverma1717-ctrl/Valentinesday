<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        :root {
            /* Change this hex code to your specific color */
            --primary-color: #FF4D6D; 
            --accent-green: #4CAF50;
            --bg-pink: #FFF0F3;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-pink);
            font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 800px;
        }

        h1 {
            font-size: 3.5rem; /* Made larger */
            color: var(--primary-color);
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
        }

        /* Subtle Photo Frame */
        .img-wrapper {
            display: inline-block;
            padding: 15px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 40px;
            border: 1px solid rgba(0,0,0,0.05);
        }

        #me-img {
            width: 350px; /* Made larger */
            display: block;
            border-radius: 10px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            height: 120px;
        }

        button {
            padding: 20px 50px; /* Made larger */
            font-size: 1.8rem; /* Made larger */
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #yesButton {
            background-color: var(--accent-green);
            color: white;
        }

        #yesButton:hover {
            transform: scale(1.1);
        }

        #noButton {
            background-color: var(--primary-color);
            color: white;
            position: absolute;
            transition: opacity 0.5s ease;
        }

        /* Fixed Heart Orientation */
        .heart-icon {
            display: inline-block;
            color: var(--primary-color);
            transform: rotate(0deg); /* Ensuring it's upright */
            font-size: 4rem;
        }
    </style>
</head>
<body>

    <div class="container" id="main-content">
        <h1>Will you be my Valentine? <span class="heart-icon">💖</span></h1>
        
        <div class="img-wrapper">
            <img src="./IMG_3913.jpeg" alt="Valentine" id="me-img">
        </div>

        <div class="buttons">
            <button id="yesButton" onclick="celebrate()">YES 💚</button>
            <button id="noButton">No ❤️</button>
        </div>
    </div>

    <script>
        const noButton = document.getElementById('noButton');
        let moveCount = 0;

        function moveAndVibrate() {
            // Vibrate phone (works on Android/Mobile)
            if (navigator.vibrate) {
                navigator.vibrate(80);
            }

            moveCount++;

            // After 6 attempts, the button disappears
            if (moveCount >= 6) {
                noButton.style.opacity = '0';
                setTimeout(() => {
                    noButton.style.display = 'none';
                }, 500);
                return;
            }

            // Move to random position
            const x = Math.random() * (window.innerWidth - noButton.offsetWidth);
            const y = Math.random() * (window.innerHeight - noButton.offsetHeight);
            
            noButton.style.left = `${x}px`;
            noButton.style.top = `${y}px`;
        }

        // Desktop Hover
        noButton.addEventListener('mouseover', moveAndVibrate);

        // Mobile Touch
        noButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveAndVibrate();
        });

        function celebrate() {
            document.getElementById('main-content').innerHTML = `
                <h1 style="font-size: 5rem;">YAY! ❤️</h1>
                <p style="font-size: 2rem; color: #555;">See you on the 14th!</p>
                <div class="heart-icon" style="font-size: 10rem;">💖</div>
            `;
        }
    </script>
</body>
</html>
