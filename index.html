<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --vibrant-coral: #E67A7A; /* Aggressive Coral from image */
            --dark-coral: #C15B5B;
            --mint-green: #90CF8E;    /* Vibrant Green from image */
            --off-white: #FDF2F2;
            --pixel-black: #2D2D2D;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--off-white);
            /* Heart GIF background - kept subtle to let buttons pop */
            background: linear-gradient(rgba(253, 242, 242, 0.8), rgba(253, 242, 242, 0.8)), 
                        url('./IMG_1279.gif?v=3');
            background-size: cover, 80px;
            font-family: 'Press Start 2P', cursive;
        }

        .container {
            text-align: center;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            background-color: var(--off-white);
            border: 6px solid var(--vibrant-coral); /* Bold border from image */
            box-shadow: 8px 8px 0px var(--pixel-black);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 12px;
            color: var(--pixel-black);
            line-height: 1.8;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .img-wrapper {
            padding: 5px;
            background: white;
            border: 4px solid var(--vibrant-coral);
            margin-bottom: 25px;
        }

        #me-img {
            width: 180px;
            display: block;
            image-rendering: pixelated;
        }

        .buttons-column {
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 20px; 
            width: 100%;
        }

        button {
            font-family: 'Press Start 2P', cursive;
            border: 4px solid var(--pixel-black);
            cursor: pointer;
            transition: all 0.2s ease-out;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: fit-content;
        }

        #yesButton {
            background-color: var(--mint-green);
            color: var(--pixel-black);
            padding: 15px 30px;
            font-size: 14px;
            box-shadow: 4px 4px 0px var(--pixel-black);
            opacity: 1; /* Full opacity as requested */
        }

        #noButton {
            background-color: var(--vibrant-coral);
            color: white;
            padding: 12px 25px;
            font-size: 10px;
            box-shadow: 4px 4px 0px var(--pixel-black);
            opacity: 1; /* Full opacity as requested */
        }

        button:active {
            box-shadow: 0px 0px 0px;
            transform: translate(4px, 4px);
        }
    </style>
</head>
<body>

    <div class="container" id="main-content">
        <h1>Will you be my Valentine?</h1>
        
        <div class="img-wrapper">
            <img src="./IMG_3913.jpeg" alt="Valentine" id="me-img">
        </div>

        <div class="buttons-column">
            <button id="yesButton" onclick="celebrate()">YES</button>
            <button id="noButton" onclick="handleNoClick()">NO</button>
        </div>
    </div>

    <script>
        let clickCount = 0;
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');

        const noTexts = [
            "Are you sure?",
            "Really sure?",
            "I will be sad",
            "Please",
            "Please naaaaa",
            "Daba na yes",
            "YES BOLA MAINE",
            "No nhi bolte"
        ];

        function handleNoClick() {
            if (navigator.vibrate) {
                navigator.vibrate(80); 
            }

            if (clickCount < noTexts.length) {
                noButton.innerText = noTexts[clickCount];
            }

            clickCount++;

            /* AGGRESSIVE FONT & BUTTON GROWTH */
            let paddingV = 15 + (clickCount * 8); 
            let paddingH = 30 + (clickCount * 12);
            let fontSize = 14 + (clickCount * 4); // Font size increases with button

            yesButton.style.padding = `${paddingV}px ${paddingH}px`;
            yesButton.style.fontSize = `${fontSize}px`;

            if (clickCount > noTexts.length) {
                noButton.style.display = 'none';
            }
        }

        function celebrate() {
            document.getElementById('main-content').innerHTML = `
                <h1 style="font-size: 20px;">YAY! ❤️</h1>
                <p style="font-size: 10px; color: var(--pixel-black);">SEE YOU ON THE 14TH!</p>
            `;
        }
    </script>
</body>
</html>
