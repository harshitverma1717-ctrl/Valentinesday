<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine</title>

<style>
body {
  background-color: #ffc0cb; /* pink */
  font-family: Arial, sans-serif;
  text-align: center;
  padding-top: 120px;
  overflow: hidden;
}

h2 {
  margin-bottom: 40px;
}

button {
  padding: 16px 36px;
  font-size: 18px;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  transition: transform 0.3s ease;
}

#yes {
  background-color: #28a745; /* green */
  color: white;
  font-size: 22px;
}

#no {
  background-color: #dc3545; /* red */
  color: white;
  margin-top: 25px;
}

/* Shake animation for NO */
@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  75% { transform: translateX(-5px); }
  100% { transform: translateX(0); }
}
</style>
</head>

<body>

<h2>Naaz, will you be my Valentine? 💖</h2>

<button id="yes">YES 💚</button>
<br><br>
<button id="no">NO ❌</button>

<script>
const noTexts = [
  "Are you sure?",
  "Really sure?",
  "I will be really sad 🥺",
  "Please",
  "Please naaaaa 😭",
  "Chal chal YES daba",
  "YES bola maine",
  "Senior ko no nhi bolte"
];

let clickCount = 0;
let yesScale = 1;

const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");

noBtn.addEventListener("click", () => {
  // Change NO text
  if (clickCount < noTexts.length) {
    noBtn.textContent = noTexts[clickCount];
    clickCount++;
  }

  // Grow YES button
  yesScale += 0.35;
  yesBtn.style.transform = `scale(${yesScale})`;

  // Shake NO button
  noBtn.style.animation = "shake 0.4s";
  setTimeout(() => {
    noBtn.style.animation = "";
  }, 400);
});

yesBtn.addEventListener("click", () => {
  document.body.innerHTML = `
    <h1 style="margin-top:150px;">YAY 💕</h1>
    <h2>I was really hoping you’d say yes 😌</h2>
  `;
});
</script>

</body>
</html>
