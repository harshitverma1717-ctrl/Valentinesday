<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine?</title>

<style>
  * {
    box-sizing: border-box;
    font-family: 'Arial', sans-serif;
  }

  body {
    margin: 0;
    height: 100vh;
    background: pink;
    overflow: hidden;
  }

  /* Pixel hearts background */
  .hearts {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .heart {
    position: absolute;
    width: 20px;
    height: 20px;
    background: red;
    transform: rotate(45deg);
    animation: float 8s linear infinite, spin 4s linear infinite;
  }

  .heart::before,
  .heart::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    background: red;
    border-radius: 50%;
  }

  .heart::before {
    top: -10px;
    left: 0;
  }

  .heart::after {
    left: -10px;
    top: 0;
  }

  @keyframes float {
    from { transform: translateY(100vh) rotate(45deg); }
    to { transform: translateY(-10vh) rotate(45deg); }
  }

  @keyframes spin {
    from { rotate: 0deg; }
    to { rotate: 360deg; }
  }

  /* Main container */
  .container {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  h1 {
    margin-bottom: 15px;
  }

  .photo {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid white;
    margin-bottom: 20px;
  }

  .buttons {
    display: flex;
    gap: 20px;
  }

  button {
    padding: 15px 25px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }

  #yesBtn {
    background: green;
    color: white;
    transition: transform 0.3s;
  }

  #noBtn {
    background: red;
    color: white;
  }
</style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<div class="container">
  <img src="IMG_0980.jpeg" class="photo" alt="Me">
  <h1>Will you be my Valentine? 💖</h1>

  <div class="buttons">
    <button id="yesBtn">YES</button>
    <button id="noBtn">NO</button>
  </div>
</div>

<script>
  // hearts generator
  const hearts = document.getElementById("hearts");
  for (let i = 0; i < 30; i++) {
    const h = document.createElement("div");
    h.className = "heart";
    h.style.left = Math.random() * 100 + "vw";
    h.style.animationDuration = 5 + Math.random() * 5 + "s";
    hearts.appendChild(h);
  }

  const noTexts = [
    "Are you sure?",
    "Really sure?",
    "I will be really sad",
    "Please",
    "Please naaaaa",
    "Chal chal YES daba",
    "YES BOLA MAINE",
    "Senior ko no nhi bolte"
  ];

  let clickCount = 0;
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");

  noBtn.addEventListener("click", () => {
    if (clickCount < noTexts.length) {
      noBtn.innerText = noTexts[clickCount];
      clickCount++;

      const scale = 1 + clickCount * 0.3;
      yesBtn.style.transform = `scale(${scale})`;
    }
  });

  yesBtn.addEventListener("click", () => {
    document.body.innerHTML = `
      <div style="
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        font-size:32px;
        background:pink;
      ">
        💖 YAY! SEE YOU SOON 💖
      </div>
    `;
  });
</script>

</body>
</html>
