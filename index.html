<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: #ffc0cb;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  /* Floating pixel hearts */
  .heart {
    position: fixed;
    width: 60px;
    opacity: 0.6;
    z-index: 1;
    animation: float 14s linear infinite;
  }

  @keyframes float {
    from { transform: translateY(110vh) rotate(0deg); }
    to   { transform: translateY(-130vh) rotate(360deg); }
  }

  .card {
    background: white;
    padding: 25px 30px 40px;
    border-radius: 20px;
    text-align: center;
    z-index: 10;
    width: 280px;
  }

  h1 {
    margin-bottom: 15px;
  }

  /* Pixelated black frame */
  .photo-frame {
    padding: 8px;
    background:
      repeating-linear-gradient(
        0deg,
        #000 0px,
        #000 4px,
        transparent 4px,
        transparent 8px
      ),
      repeating-linear-gradient(
        90deg,
        #000 0px,
        #000 4px,
        transparent 4px,
        transparent 8px
      );
    border-radius: 12px;
    display: inline-block;
    margin-bottom: 20px;
  }

  .photo-frame img {
    width: 160px;
    border-radius: 8px;
    display: block;
  }

  .buttons {
    position: relative;
    height: 150px; /* LOCKED HEIGHT */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }

  #yesBtn {
    background: #2ecc71;
    color: white;
    font-size: 20px;
    padding: 14px 32px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    transition: transform 0.3s ease;
    z-index: 2;
  }

  #noBtn {
    background: #e74c3c;
    color: white;
    font-size: 18px;
    padding: 12px 28px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    margin-top: 25px;
    z-index: 3; /* ALWAYS ABOVE YES */
  }
</style>
</head>

<body>

<!-- Hearts -->
<img src="./IMG_1279.gif?v=3" class="heart" style="left:10%;">
<img src="./IMG_1279.gif?v=3" class="heart" style="left:30%; animation-duration:18s;">
<img src="./IMG_1279.gif?v=3" class="heart" style="left:55%; animation-duration:16s;">
<img src="./IMG_1279.gif?v=3" class="heart" style="left:75%; animation-duration:20s;">

<div class="card">
  <h1>Will you be my Valentine? 💖</h1>

  <div class="photo-frame">
    <img src="./IMG_3913.jpeg?v=3" alt="Me">
  </div>

  <div class="buttons">
    <button id="yesBtn">YES 💚</button>
    <button id="noBtn">No ❤️</button>
  </div>
</div>

<script>
  const texts = [
    "Are you sure?",
    "Really sure?",
    "I will be really sad",
    "Please",
    "Please naaaaa",
    "Chal chal yes daba",
    "YES bola maine",
    "Senior ko no nhi bolte"
  ];

  let i = 0;
  let scale = 1;

  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");

  noBtn.addEventListener("click", () => {
    if (i < texts.length) {
      noBtn.innerText = texts[i++];
    }
    scale += 0.25;
    if (scale > 2.1) scale = 2.1;
    yesBtn.style.transform = `scale(${scale})`;
  });

  yesBtn.addEventListener("click", () => {
    document.body.innerHTML =
      "<h1 style='color:white;text-align:center;'>💖 SHE SAID YES 💖</h1>";
  });
</script>

</body>
</html>
