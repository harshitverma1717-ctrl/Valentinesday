<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <style>
        :root {
            --primary-red: #f44336;
            --accent-green: #4caf50;
            --bg-pink: #fff0f3;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-pink);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        h1 {
            font-size: 2rem;
            color: #d63384;
            margin-bottom: 20px;
        }

        /* Subtle Photo Frame */
        .img-wrapper {
            display: inline-block;
            padding: 8px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            border: 1px solid rgba(0,0,0,0.05);
        }

        #me-img {
            width: 200px;
            display: block;
            border-radius: 6px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        #yesButton {
            background-color: var(--accent-green);
            color: white;
            min-width: 100px;
        }

        #noButton {
            background-color: var(--primary-red);
            color: white;
        }

        .heart-icon {
            display: inline-block;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="container" id="main-content">
        <h1>Will you be my Valentine? <span class="heart-icon">💖</span></h1>
        
        <div class="img-wrapper">
            <img src="./IMG_3913.jpeg" alt="Valentine" id="me-img">
        </div>

        <div class="buttons">
            <button id="yesButton" onclick="celebrate()">YES 💚</button>
            <button id="noButton" onclick="handleNoClick()">No ❤️</button>
        </div>
    </div>

    <script>
        let clickCount = 0;
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');

        const noTexts = [
            "Are you sure?",
            "Really sure?",
            "I will be really sad",
            "Please",
            "Please naaaaa",
            "Chal chal yes daba",
            "YES BOLA MAINE",
            "Senior ko no nhi bolte"
        ];

        function handleNoClick() {
            // VIBRATION: Needs to be triggered by a click to work on most browsers
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100]); 
            }

            // Change No Button Text
            if (clickCount < noTexts.length) {
                noButton.innerText = noTexts[clickCount];
            } else {
                // After the last phrase, the No button disappears
                noButton.style.display = 'none';
            }

            // Make YES Button Bigger
            clickCount++;
            let newScale = 1 + (clickCount * 0.4); // Increases by 40% each click
            let newPadding = 12 + (clickCount * 10);
            
            yesButton.style.transform = `scale(${newScale})`;
            // Ensure the YES button doesn't go off screen but stays large
            if (newScale > 4) {
                yesButton.style.position = 'fixed';
                yesButton.style.top = '50%';
                yesButton.style.left = '50%';
                yesButton.style.transform = 'translate(-50%, -50%) scale(5)';
                yesButton.style.zIndex = '100';
            }
        }

        function celebrate() {
            document.getElementById('main-content').innerHTML = `
                <h1 style="font-size: 3rem;">YAY! ❤️</h1>
                <p style="font-size: 1.5rem;">See you soon!</p>
                <div style="font-size: 5rem;">💖</div>
            `;
        }
    </script>
</body>
</html>
