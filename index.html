<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --vibrant-coral: #E67A7A; /* Shadow / Darker Border */
            --light-coral: #F4A7A7;   /* Main Tab / Light Border */
            --mint-green: #90CF8E;    
            --bg-cream: #FDF2F2;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-cream);
            /* Reduced number of hearts by increasing background size and adding more padding in the gradient */
            background-image: linear-gradient(rgba(253, 242, 242, 0.9), rgba(253, 242, 242, 0.9)), 
                              url('./IMG_1279.gif?v=3');
            background-size: 120px; /* Larger size = Fewer hearts on screen */
            background-repeat: repeat;
            font-family: 'Press Start 2P', cursive;
        }

        /* Overall size reduced */
        .window-tab {
            width: 85%;
            max-width: 380px; 
            background-color: var(--light-coral);
            /* Main border is lighter, Shadow is darker coral */
            border: 4px solid var(--light-coral);
            box-shadow: 6px 6px 0px var(--vibrant-coral);
            overflow: hidden;
        }

        .title-bar {
            background-color: var(--vibrant-coral);
            padding: 8px;
            border-bottom: 4px solid var(--vibrant-coral);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: 8px;
        }

        .heart-row {
            padding: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            background-color: rgba(255, 255, 255, 0.15);
            border-bottom: 4px solid var(--vibrant-coral);
        }

        .pixel-dot {
            width: 4px;
            height: 4px;
            background-color: var(--vibrant-coral);
        }

        .row-img {
            width: 30px;
            height: auto;
            image-rendering: pixelated;
        }

        .content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Heading now White */
        h1 {
            font-size: 13px; 
            color: white;
            margin: 10px 0 20px 0;
            text-transform: uppercase;
            line-height: 1.4;
            text-align: center;
            text-shadow: 2px 2px var(--vibrant-coral);
        }

        .img-wrapper {
            /* Removed white border/padding */
            background: none;
            border: 4px solid var(--vibrant-coral);
            margin-bottom: 20px;
            box-shadow: 4px 4px 0px var(--vibrant-coral);
            line-height: 0;
        }

        #me-img {
            width: 180px; /* Smaller picture */
            display: block;
            image-rendering: pixelated;
        }

        .buttons-column {
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        button {
            font-family: 'Press Start 2P', cursive;
            border: 4px solid var(--vibrant-coral);
            cursor: pointer;
            text-transform: uppercase;
            width: 180px; /* Reduced button width */
            height: 50px; /* Reduced button height */
            box-shadow: 4px 4px 0px var(--vibrant-coral);
            transition: all 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #yesButton { 
            background-color: var(--mint-green); 
            color: white; 
            font-size: 10px;
        }

        #noButton { 
            background-color: var(--vibrant-coral); 
            color: white; 
            font-size: 10px; 
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px;
        }
    </style>
</head>
<body>

    <div class="window-tab" id="main-content">
        <div class="title-bar">
            <span>LOVE</span>
            <div>- □ ×</div>
        </div>

        <div class="heart-row">
            <div class="pixel-dot"></div>
            <img src="./IMG_1287.png" class="row-img" alt="deco">
            <div class="pixel-dot"></div>
            <img src="./IMG_1287.png" class="row-img" alt="deco">
            <div class="pixel-dot"></div>
            <img src="./IMG_1287.png" class="row-img" alt="deco">
            <div class="pixel-dot"></div>
        </div>

        <div class="content">
            <h1>Will you be my Valentine?</h1>
            
            <div class="img-wrapper">
                <img src="./IMG_3913.jpeg" alt="Valentine" id="me-img">
            </div>

            <div class="buttons-column">
                <button id="yesButton" onclick="celebrate()">YES</button>
                <button id="noButton" onclick="handleNoClick()">NO</button>
            </div>
        </div>
    </div>

    <script>
        let clickCount = 0;
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');

        const noTexts = [
            "Are you sure?",
            "Really sure?",
            "I will be sad",
            "Please",
            "Please naaaaa",
            "Chal daba na yes",
            "YES BOLA MAINE",
            "Boss ko no nhi bolte"
        ];

        function handleNoClick() {
            if (navigator.vibrate) navigator.vibrate(80); 
            if (clickCount < noTexts.length) noButton.innerText = noTexts[clickCount];

            clickCount++;

            // Scaled growth for the smaller initial size
            let newWidth = 180 + (clickCount * 25);
            let newHeight = 50 + (clickCount * 15);
            let fontSize = 10 + (clickCount * 2);

            yesButton.style.width = `${newWidth}px`;
            yesButton.style.height = `${newHeight}px`;
            yesButton.style.fontSize = `${fontSize}px`;

            if (clickCount > noTexts.length) noButton.style.display = 'none';
        }

        function celebrate() {
            document.getElementById('main-content').innerHTML = `
                <div class="title-bar" style="border-bottom: 4px solid var(--vibrant-coral);">
                    <span>SUCCESS</span><div>×</div>
                </div>
                <div class="content">
                    <h1 style="font-size: 16px; margin: 30px 0;">YAY! ❤️</h1>
                    <p style="font-size: 8px; line-height: 2; color: white; text-shadow: 1px 1px var(--vibrant-coral);">SEE YOU ON THE 14TH!</p>
                </div>
            `;
        }
    </script>
</body>
</html>
