<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Will you be my Valentine?</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: #ffc0cb;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Arial', sans-serif;
    overflow: hidden;
  }

  /* Floating hearts */
  .heart {
    position: absolute;
    width: 60px;
    opacity: 0.8;
    animation: float 12s linear infinite;
  }

  @keyframes float {
    from {
      transform: translateY(100vh) rotate(0deg);
    }
    to {
      transform: translateY(-120vh) rotate(360deg);
    }
  }

  /* Main card */
  .card {
    background: #fff;
    padding: 25px 30px;
    border-radius: 20px;
    text-align: center;
    z-index: 10;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  h1 {
    margin-bottom: 15px;
  }

  /* Pixelated photo frame */
  .photo-frame {
    padding: 10px;
    background:
      repeating-linear-gradient(
        0deg,
        #000 0px,
        #000 4px,
        transparent 4px,
        transparent 8px
      ),
      repeating-linear-gradient(
        90deg,
        #000 0px,
        #000 4px,
        transparent 4px,
        transparent 8px
      );
    display: inline-block;
    border-radius: 12px;
    margin-bottom: 15px;
  }

  .photo-frame img {
    width: 160px;
    border-radius: 8px;
    display: block;
  }

  /* Buttons */
  .buttons {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    margin-top: 15px;
  }

  #yesBtn {
    background: #2ecc71;
    color: white;
    font-size: 20px;
    padding: 14px 32px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  #noBtn {
    background: #e74c3c;
    color: white;
    font-size: 18px;
    padding: 12px 28px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
  }
</style>
</head>

<body>

<!-- Hearts (not crowded) -->
<img src="IMG_1279.gif" class="heart" style="left:10%; animation-duration:14s;">
<img src="IMG_1279.gif" class="heart" style="left:35%; animation-duration:16s;">
<img src="IMG_1279.gif" class="heart" style="left:60%; animation-duration:13s;">
<img src="IMG_1279.gif" class="heart" style="left:80%; animation-duration:18s;">

<div class="card">
  <h1>Will you be my Valentine? 💖</h1>

  <div class="photo-frame">
    <img src="IMG_3913.jpeg" alt="Me">
  </div>

  <div class="buttons">
    <button id="yesBtn">YES 💚</button>
    <button id="noBtn">No ❤️</button>
  </div>
</div>

<script>
  const noTexts = [
    "Are you sure?",
    "Really sure?",
    "I will be really sad",
    "Please",
    "Please naaaaa",
    "Chal chal yes daba",
    "YES bola maine",
    "Senior ko no nhi bolte"
  ];

  let noIndex = 0;
  let scale = 1;

  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");

  noBtn.addEventListener("click", () => {
    if (noIndex < noTexts.length) {
      noBtn.innerText = noTexts[noIndex];
      noIndex++;
    }

    scale += 0.25;
    if (scale > 2.2) scale = 2.2;
    yesBtn.style.transform = `scale(${scale})`;
  });

  yesBtn.addEventListener("click", () => {
    document.body.innerHTML = "<h1 style='color:white;'>💖 SHE SAID YES 💖</h1>";
  });
</script>

</body>
</html>
