<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --vibrant-coral: #E67A7A; 
            --light-coral: #F4A7A7;   
            --mint-green: #90CF8E;    
            --bg-cream: #FDF2F2;
            --pixel-black: #000000;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-cream);
            /* Hearts are now tiny (15px) and more frequent with a 60px grid */
            background-image: linear-gradient(rgba(253, 242, 242, 0.92), rgba(253, 242, 242, 0.92)), 
                              url('./IMG_1279.gif?v=3');
            background-size: 60px 60px; 
            background-repeat: repeat;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
        }

        .window-tab {
            width: 85%;
            max-width: 380px; 
            background-color: var(--light-coral);
            border: 4px solid var(--light-coral);
            box-shadow: 8px 8px 0px var(--pixel-black);
            overflow: hidden;
            position: relative;
            z-index: 5;
        }

        /* 4-Second Smooth Pink Transition Curtain */
        #transition-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--light-coral);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            /* Transition set to 2s in and 2s out for a total of 4s feel */
            transition: opacity 2s ease-in-out;
        }

        .title-bar {
            background-color: var(--vibrant-coral);
            padding: 12px;
            border-bottom: 4px solid var(--vibrant-coral);
            display: flex; justify-content: space-between; align-items: center;
            color: white; font-size: 14px; 
        }

        .heart-row {
            padding: 8px;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            background-color: rgba(255, 255, 255, 0.15);
            border-bottom: 4px solid var(--vibrant-coral);
        }

        .pixel-dot { width: 4px; height: 4px; background-color: var(--vibrant-coral); }
        .row-img { width: 35px; height: auto; image-rendering: pixelated; }

        .content { padding: 15px; display: flex; flex-direction: column; align-items: center; }

        h1 {
            font-size: 13px; color: white; margin: 10px 0 20px 0;
            text-transform: uppercase; line-height: 1.4; text-align: center;
            text-shadow: 2px 2px var(--vibrant-coral);
        }

        .img-wrapper {
            background: none; border: 4px solid var(--vibrant-coral);
            margin-bottom: 20px; box-shadow: 4px 4px 0px var(--pixel-black);
            line-height: 0;
        }

        #me-img { width: 180px; display: block; image-rendering: pixelated; }

        button {
            font-family: 'Press Start 2P', cursive;
            border: 4px solid var(--pixel-black); cursor: pointer;
            text-transform: uppercase; width: 200px; min-height: 55px;
            box-shadow: 4px 4px 0px var(--pixel-black); transition: all 0.1s;
            display: flex; justify-content: center; align-items: center;
            padding: 10px; white-space: nowrap; 
        }

        #yesButton { background-color: var(--mint-green); color: white; font-size: 10px; }
        #noButton { background-color: var(--vibrant-coral); color: white; font-size: 10px; }

        .confetti-overlay {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-image: url('./IMG_1288.gif');
            background-size: cover; pointer-events: none;
            z-index: 100; display: none;
        }
    </style>
</head>
<body>

    <audio id="valentineMusic">
        <source src="ℍ𝕆𝕋! JVKE ~ her Ringtone (Free).mp3" type="audio/mpeg">
    </audio>

    <div id="transition-overlay"></div>
    <div class="confetti-overlay" id="confetti"></div>

    <div class="window-tab" id="main-content">
        <div class="title-bar"><span>LOVE</span><div>- □ ×</div></div>
        <div class="heart-row" id="decor-row">
            <div class="pixel-dot"></div>
            <img src="./IMG_1287.png" class="row-img" alt="deco">
            <div class="pixel-dot"></div>
            <img src="./IMG_1287.png" class="row-img" alt="deco">
            <div class="pixel-dot"></div>
            <img src="./IMG_1287.png" class="row-img" alt="deco">
            <div class="pixel-dot"></div>
        </div>
        <div class="content">
            <h1>Will you be my Valentine?</h1>
            <div class="img-wrapper"><img src="./IMG_3913.jpeg" alt="Valentine" id="me-img"></div>
            <div style="display: flex; flex-direction: column; gap: 12px; align-items: center;">
                <button id="yesButton" onclick="handleYesClick()">YES</button>
                <button id="noButton" onclick="handleNoClick()">NO</button>
            </div>
        </div>
    </div>

    <script>
        let clickCount = 0;
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');
        const music = document.getElementById('valentineMusic');
        const overlay = document.getElementById('transition-overlay');

        function handleNoClick() {
            const noTexts = ["Are you sure?", "Really sure?", "I will be sad", "Please", "Please naaaaa", "Chal daba na yes", "YES BOLA MAINE", "Boss ko no nhi bolte"];
            if (clickCount < noTexts.length) {
                noButton.innerText = noTexts[clickCount];
            }
            clickCount++;
            yesButton.style.width = `${200 + (clickCount * 30)}px`;
            yesButton.style.height = `${55 + (clickCount * 15)}px`;
            yesButton.style.fontSize = `${10 + (clickCount * 2)}px`;
            if (clickCount > noTexts.length) noButton.style.display = 'none';
        }

        function handleYesClick() {
            music.play();
            
            // 1. Fade in the pink curtain (Takes 2 seconds)
            overlay.style.opacity = "1";
            overlay.style.pointerEvents = "all";

            setTimeout(() => {
                celebrate();
                // 2. Fade out the curtain (Takes another 2 seconds)
                overlay.style.opacity = "0";
                overlay.style.pointerEvents = "none";
                
                // 3. Trigger confetti as the final page is revealed
                setTimeout(() => {
                    document.getElementById('confetti').style.display = 'block';
                }, 1000);

            }, 2000); // Wait 2s before starting the fade-out
        }

        function celebrate() {
            const mainContent = document.getElementById('main-content');
            const decorRowHTML = document.getElementById('decor-row').innerHTML;
            
            mainContent.innerHTML = `
                <div class="title-bar"><span>SUCCESS</span><div>×</div></div>
                <div class="heart-row">${decorRowHTML}</div>
                <div class="content">
                    <div class="img-wrapper" style="margin-top: 10px;">
                        <img src="./IMG_1056.jpeg" style="width: 180px; display: block; image-rendering: pixelated;">
                    </div>
                    <h1 style="font-size: 20px; margin: 10px 0;">YAY!</h1>
                    <p style="font-size: 13px; color: white; text-shadow: 2px 2px var(--vibrant-coral); text-align: center; text-transform: uppercase; white-space: nowrap;">
                        SEE YOU ON THE 14TH!
                    </p>
                </div>
            `;
        }
    </script>
</body>
</html>
