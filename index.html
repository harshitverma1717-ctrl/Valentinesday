<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <style>
        :root {
            --primary-red: #f44336;
            --accent-green: #4caf50;
            --bg-pink: #fff0f3;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-pink);
            /* Floating Hearts Background */
            background-image: url('./IMG_1279.gif?v=3');
            background-size: 80px; /* Smaller size = more hearts on screen */
            background-repeat: repeat;
            font-family: 'Arial', sans-serif;
            overflow-y: auto;
        }

        .container {
            text-align: center;
            padding: 30px;
            width: 90%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Transparent background to let hearts show through clearly */
            background-color: rgba(255, 255, 255, 0.4); 
            backdrop-filter: blur(2px); /* Slight blur for readability */
            border-radius: 30px;
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        h1 {
            font-size: 2rem;
            color: #d63384;
            margin-bottom: 20px;
            text-shadow: 1px 1px 0px white;
        }

        /* Subtle Photo Frame with Floating Animation */
        .img-wrapper {
            display: inline-block;
            padding: 10px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            border: 1px solid rgba(0,0,0,0.05);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        #me-img {
            width: 220px;
            display: block;
            border-radius: 8px;
        }

        .buttons {
            display: flex;
            flex-direction: column; /* Vertical Stack */
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #yesButton {
            background-color: var(--accent-green);
            color: white;
            z-index: 20;
        }

        #noButton {
            background-color: var(--primary-red);
            color: white;
            z-index: 15;
        }

    </style>
</head>
<body>

    <div class="container" id="main-content">
        <h1>Will you be my Valentine? 💖</h1>
        
        <div class="img-wrapper">
            <img src="./IMG_3913.jpeg" alt="Valentine" id="me-img">
        </div>

        <div class="buttons">
            <button id="yesButton" onclick="celebrate()">YES 💚</button>
            <button id="noButton" onclick="handleNoClick()">No ❤️</button>
        </div>
    </div>

    <script>
        let clickCount = 0;
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');

        const noTexts = [
            "Are you sure?",
            "Really sure?",
            "I will be really sad",
            "Please",
            "Please naaaaa",
            "Chal chal yes daba",
            "YES BOLA MAINE",
            "Senior ko no nhi bolte"
        ];

        function handleNoClick() {
            // VIBRATION logic
            if (navigator.vibrate) {
                navigator.vibrate(100); 
            }

            // Change No Button Text
            if (clickCount < noTexts.length) {
                noButton.innerText = noTexts[clickCount];
            }

            clickCount++;

            // Increase YES Button Size
            // We use padding/font to push layout so it doesn't cover the photo
            let newPaddingV = 15 + (clickCount * 15); 
            let newPaddingH = 40 + (clickCount * 20);
            let newFontSize = 1.2 + (clickCount * 0.2);

            yesButton.style.padding = `${newPaddingV}px ${newPaddingH}px`;
            yesButton.style.fontSize = `${newFontSize}rem`;

            // Hide No button after final phrase
            if (clickCount > noTexts.length) {
                noButton.style.display = 'none';
            }
        }

        function celebrate() {
            document.getElementById('main-content').innerHTML = `
                <h1 style="font-size: 3.5rem;">YAY! ❤️</h1>
                <p style="font-size: 1.5rem; font-weight: bold;">See you on the 14th!</p>
            `;
            // Make background hearts even more dense on success
            document.body.style.backgroundSize = "50px";
        }
    </script>
</body>
</html>
