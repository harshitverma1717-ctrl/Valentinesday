<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --vibrant-coral: #E67A7A; 
            --mint-green: #90CF8E;    
            --bg-cream: #FDF2F2;
            --window-pink: #F4A7A7;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-cream);
            /* Background hearts: smaller (40px) and more spaced out */
            background-image: linear-gradient(rgba(253, 242, 242, 0.85), rgba(253, 242, 242, 0.85)), 
                              url('./IMG_1279.gif?v=3');
            background-size: 40px; 
            background-repeat: repeat;
            font-family: 'Press Start 2P', cursive;
        }

        .window-tab {
            width: 95%;
            max-width: 480px; 
            background-color: var(--window-pink);
            /* Changed black border to coral */
            border: 4px solid var(--vibrant-coral);
            box-shadow: 8px 8px 0px var(--vibrant-coral);
            overflow: hidden;
        }

        .title-bar {
            background-color: var(--vibrant-coral);
            padding: 10px;
            /* Changed black border to coral (darkened slightly for depth) */
            border-bottom: 4px solid var(--vibrant-coral);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: 10px;
        }

        .heart-row {
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background-color: rgba(255, 255, 255, 0.2);
            border-bottom: 4px solid var(--vibrant-coral);
        }

        /* Pixelated dots using tab color */
        .pixel-dot {
            width: 6px;
            height: 6px;
            background-color: var(--vibrant-coral);
        }

        .row-img {
            width: 40px;
            height: auto;
            image-rendering: pixelated;
        }

        .content {
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Increased Font Size */
        h1 {
            font-size: 16px; 
            color: var(--vibrant-coral);
            margin: 10px 0 25px 0;
            text-transform: uppercase;
            line-height: 1.6;
            text-align: center;
        }

        .img-wrapper {
            padding: 6px;
            background: white;
            /* Border matches main tab color */
            border: 4px solid var(--vibrant-coral);
            margin-bottom: 30px;
            box-shadow: 4px 4px 0px var(--vibrant-coral);
        }

        #me-img {
            width: 240px; 
            display: block;
            image-rendering: pixelated;
        }

        .buttons-column {
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        button {
            font-family: 'Press Start 2P', cursive;
            /* Changed black border to coral */
            border: 4px solid var(--vibrant-coral);
            cursor: pointer;
            text-transform: uppercase;
            width: 220px;
            height: 60px;
            box-shadow: 4px 4px 0px var(--vibrant-coral);
            transition: all 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #yesButton { 
            background-color: var(--mint-green); 
            color: white; 
            font-size: 12px;
            z-index: 10;
        }

        #noButton { 
            background-color: var(--vibrant-coral); 
            color: white; 
            font-size: 12px; 
        }

        button:active {
            transform: translate(3px, 3px);
            box-shadow: 0px 0px 0px;
        }
    </style>
</head>
<body>

    <div class="window-tab" id="main-content">
        <div class="title-bar">
            <span>LOVE</span>
            <div>- □ ×</div>
        </div>

        <div class="heart-row">
            <div class="pixel-dot"></div>
            <img src="./IMG_1287.png" class="row-img" alt="deco">
            <div class="pixel-dot"></div>
            <img src="./IMG_1287.png" class="row-img" alt="deco">
            <div class="pixel-dot"></div>
            <img src="./IMG_1287.png" class="row-img" alt="deco">
            <div class="pixel-dot"></div>
        </div>

        <div class="content">
            <h1>Will you be my Valentine?</h1>
            
            <div class="img-wrapper">
                <img src="./IMG_3913.jpeg" alt="Valentine" id="me-img">
            </div>

            <div class="buttons-column">
                <button id="yesButton" onclick="celebrate()">YES</button>
                <button id="noButton" onclick="handleNoClick()">NO</button>
            </div>
        </div>
    </div>

    <script>
        let clickCount = 0;
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');

        const noTexts = [
            "Are you sure?",
            "Really sure?",
            "I will be sad",
            "Please",
            "Please naaaaa",
            "Chal daba na yes",
            "YES BOLA MAINE",
            "Boss ko no nhi bolte"
        ];

        function handleNoClick() {
            if (navigator.vibrate) navigator.vibrate(80); 
            if (clickCount < noTexts.length) noButton.innerText = noTexts[clickCount];

            clickCount++;

            let newWidth = 220 + (clickCount * 30);
            let newHeight = 60 + (clickCount * 18);
            let fontSize = 12 + (clickCount * 3);

            yesButton.style.width = `${newWidth}px`;
            yesButton.style.height = `${newHeight}px`;
            yesButton.style.fontSize = `${fontSize}px`;

            if (clickCount > noTexts.length) noButton.style.display = 'none';
        }

        function celebrate() {
            document.getElementById('main-content').innerHTML = `
                <div class="title-bar" style="border-bottom: 4px solid var(--vibrant-coral);">
                    <span>SUCCESS</span><div>×</div>
                </div>
                <div class="content">
                    <h1 style="font-size: 20px; margin: 40px 0;">YAY! ❤️</h1>
                    <p style="font-size: 10px; line-height: 2; color: var(--vibrant-coral);">SEE YOU ON THE 14TH!</p>
                </div>
            `;
        }
    </script>
</body>
</html>
